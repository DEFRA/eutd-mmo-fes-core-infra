name: $(BuildID)_${{ parameters.deployResources }}

trigger: none

pr: none

parameters:
  - name: deployToDevelopmentEnvironment
    displayName: "Deploy from Feature Branch"
    type: boolean
    default: true
  - name: deployResources
    displayName: "Resources to Deploy"
    type: string
    default: "All"
    values:
      - All
      - NetworkAndLogAnalytics
      - AppInsights
      - KeyVault
      - CosmosDb
      - StorageAccounts
      - ServiceBus
      - Redis
      - Event
      - AppServicePlan
      - WebApps
      - FunctionApps
      - KeyVaultRoleAssignments
      - LogicApps
      - ConnectionStrings
      - ApiConnections
  - name: skipPRE1
    type: boolean
    default: false

resources:
  repositories:
    - repository: MMOPipelineCommon
      name: "DEFRA/eutd-mmo-fes-pipeline-common"
      endpoint: DEFRA
      type: github
      ref: feature/azure-managed-redis

variables:
  - name: IsAll
    value: ${{ eq(parameters.deployResources,'All') }}
  - name: IsNetworkAndLogAnalytics
    value: ${{ eq(parameters.deployResources,'NetworkAndLogAnalytics') }}
  - name: IsAppInsights
    value: ${{ eq(parameters.deployResources,'AppInsights') }}
  - name: IsKeyVault
    value: ${{ eq(parameters.deployResources,'KeyVault') }}
  - name: IsCosmosDb
    value: ${{ eq(parameters.deployResources,'CosmosDb') }}
  - name: IsStorageAccounts
    value: ${{ eq(parameters.deployResources,'StorageAccounts') }}
  - name: IsServiceBus
    value: ${{ eq(parameters.deployResources,'ServiceBus') }}
  - name: IsRedis
    value: ${{ eq(parameters.deployResources,'Redis') }}
  - name: IsEvent
    value: ${{ eq(parameters.deployResources,'Event') }}
  - name: IsAppServicePlan
    value: ${{ eq(parameters.deployResources,'AppServicePlan') }}
  - name: IsWebApps
    value: ${{ eq(parameters.deployResources,'WebApps') }}
  - name: IsFunctionApps
    value: ${{ eq(parameters.deployResources,'FunctionApps') }}
  - name: IsKeyVaultRoleAssignments
    value: ${{ eq(parameters.deployResources,'KeyVaultRoleAssignments') }}
  - name: IsLogicApps
    value: ${{ eq(parameters.deployResources,'LogicApps') }}
  - name: IsConnectionStrings
    value: ${{ eq(parameters.deployResources,'ConnectionStrings') }}
  - name: IsApiConnections
    value: ${{ eq(parameters.deployResources,'ApiConnections') }}

extends:
  template: /includes/infra-deploy.yaml@MMOPipelineCommon
  parameters:
    deployToDevelopmentEnvironment: ${{ parameters.deployToDevelopmentEnvironment }}
    deployToSecondaryRegion: true
    skipPRE1: ${{ parameters.skipPRE1 }}
    additionalRepositories:
      - MMOPipelineCommon
    groupedDeployments:
      - name: infraResource
        timeoutInMinutes: 60
        deployments:
          - ${{ if eq(variables.IsNetworkAndLogAnalytics, true) }}:
              - name: network
                path: templates/network
                type: bicep
                scope: "Resource Group"
                resourceGroupName: $(environmentName)$(nc-deptService)$(nc-function-network)$(nc-resource-resourcegroup)$(nc-region-id)01
              - name: logAnalytics
                path: templates/logAnalytics
                type: bicep
                scope: "Resource Group"
                resourceGroupName: "$(environmentName)$(nc-deptService)$(nc-function-infrastructure)$(nc-resource-resourcegroup)$(nc-region-id)02"

          - ${{ if or(eq(variables.IsAll, true), eq(variables.IsAppInsights, true)) }}:
              - name: appInsights
                path: templates/appInsights
                type: bicep
                scope: "Resource Group"
                resourceGroupName: "$(environmentName)$(nc-deptService)$(nc-function-infrastructure)$(nc-resource-resourcegroup)$(nc-region-id)02"

          - ${{ if or(eq(variables.IsAll, true), eq(variables.IsKeyVault, true)) }}:
              - name: keyVaultSecondaryPE
                path: templates/keyVaults
                type: bicep
                scope: "Resource Group"
                resourceGroupName: "$(environmentName)$(nc-deptService)$(nc-function-infrastructure)$(nc-resource-resourcegroup)$(nc-region-id)02"
                postDeployScriptsList:
                  - displayName: Resolve Private Endpoint IP for KeyVault
                    scriptRepo: MMOPipelineCommon
                    scriptPath: "scripts/Get-ResourcePrivateEndPointsDnsRecordsAsJson.ps1"
                    ScriptArguments: >
                      -ResourceGroupName '$(environmentName)$(nc-deptService)$(nc-function-infrastructure)$(nc-resource-resourcegroup)$(nc-static-res-region-id)02'
                      -ResourceName '$(keyVaultName)'
                      -IsSecondaryRegion $true
                  - displayName: Set DNS record for KeyVault
                    scriptRepo: MMOPipelineCommon
                    scriptPath: "scripts/Set-PrivateDnsRecordSet.ps1"
                    ScriptArguments: >
                      -UpdateAllDnsZones $true

          - ${{ if or(eq(variables.IsAll, true), eq(variables.IsCosmosDb, true)) }}:
              - name: cosmosDbFailover
                scriptRepo: MMOPipelineCommon
                type: script
                scriptType: AzurePowerShell
                path: "scripts/Switch-CosmosToSecondary.ps1"
                scriptArguments: >
                  -SubscriptionId '$(subscriptionId)'
                  -ResourceGroupName '$(environmentName)$(nc-deptService)$(nc-function-infrastructure)$(nc-resource-resourcegroup)$(nc-static-res-region-id)02'
                  -ReplicaClusterName '$(environment)$(nc-deptService)$(nc-function-database)$(nc-resource-cosmosdb)$(nc-region-id)01'

          - ${{ if or(eq(variables.IsAll, true), eq(variables.IsStorageAccounts, true)) }}:
              - name: strAccSecondaryPE
                path: templates/storageAccounts
                type: bicep
                scope: "Resource Group"
                resourceGroupName: "$(environmentName)$(nc-deptService)$(nc-function-infrastructure)$(nc-resource-resourcegroup)$(nc-region-id)02"
                postDeployScriptsList:
                  - displayName: Resolve Private Endpoint IP for Storage Accounts
                    scriptRepo: MMOPipelineCommon
                    scriptPath: "scripts/Get-ResourcePrivateEndPointsDnsRecordsAsJson.ps1"
                    ScriptArguments: >
                      -ResourceGroupName '$(environmentName)$(nc-deptService)$(nc-function-infrastructure)$(nc-resource-resourcegroup)$(nc-static-res-region-id)02'
                      -ResourceName '$(storageAccounts)'
                      -IsSecondaryRegion $true
                  - displayName: Set DNS record for Storage Accounts
                    scriptRepo: MMOPipelineCommon
                    scriptPath: "scripts/Set-PrivateDnsRecordSet.ps1"
                    ScriptArguments: >
                      -UpdateAllDnsZones $true

          - ${{ if or(eq(variables.IsAll, true), eq(variables.IsServiceBus, true)) }}:
              - name: serviceBus
                path: templates/serviceBus
                type: bicep
                scope: "Resource Group"
                resourceGroupName: "$(environmentName)$(nc-deptService)$(nc-function-infrastructure)$(nc-resource-resourcegroup)$(nc-region-id)01"

          - ${{ if or(eq(variables.IsAll, true), eq(variables.IsRedis, true)) }}:
              - name: forceUnlinkPrimaryRedis
                scriptRepo: MMOPipelineCommon
                type: script
                scriptType: AzurePowerShell
                path: "scripts/Invoke-ManagedRedisForceUnlink.ps1"
                scriptArguments: >
                  -SubscriptionId '$(subscriptionId)'
                  -HealthyCacheResourceGroupName '$(environmentName)$(nc-deptService)$(nc-function-infrastructure)$(nc-resource-resourcegroup)$(nc-region-id)01'
                  -HealthyCacheName '$(environment)$(nc-deptService)$(nc-function-infrastructure)$(nc-resource-rediscachename)$(nc-region-id)01'
                  -UnavailableCacheResourceGroupName '$(environmentName)$(nc-deptService)$(nc-function-infrastructure)$(nc-resource-resourcegroup)$(nc-static-res-region-id)01'
                  -UnavailableCacheName '$(environment)$(nc-deptService)$(nc-function-infrastructure)$(nc-resource-rediscachename)$(nc-static-res-region-id)01'
                  -Confirm:$false
              
              - name: resolveRedisPrimaryPrivateEndpoint
                scriptRepo: MMOPipelineCommon
                type: script
                scriptType: AzurePowerShell
                path: "scripts/Get-ResourcePrivateEndPointsDnsRecordsAsJson.ps1"
                scriptArguments: >
                  -ResourceGroupName '$(environmentName)$(nc-deptService)$(nc-function-infrastructure)$(nc-resource-resourcegroup)$(nc-region-id)01'
                  -ResourceName '$(environment)$(nc-deptService)$(nc-function-infrastructure)$(nc-resource-rediscachename)$(nc-region-id)01'
                  -IsSecondaryRegion $true
              
              - name: setRedisCacheDns
                scriptRepo: MMOPipelineCommon
                type: script
                scriptType: AzurePowerShell
                path: "scripts/Set-PrivateDnsRecordSet.ps1"
                scriptArguments: >
                  -UpdateAllDnsZones $true

          - ${{ if or(eq(variables.IsAll, true), eq(variables.IsEvent, true)) }}:
              - name: event
                path: templates/event
                type: bicep
                scope: "Resource Group"
                resourceGroupName: "$(environmentName)$(nc-deptService)$(nc-function-infrastructure)$(nc-resource-resourcegroup)$(nc-region-id)02"

          - ${{ if or(eq(variables.IsAll, true), eq(variables.IsAppServicePlan, true)) }}:
              - name: appServicePlan
                path: templates/appServicePlan
                type: bicep
                scope: "Resource Group"
                resourceGroupName: "$(environmentName)$(nc-deptService)$(nc-function-infrastructure)$(nc-resource-resourcegroup)$(nc-region-id)01"

          - ${{ if or(eq(variables.IsAll, true), eq(variables.IsWebApps, true)) }}:
              - name: webApps
                path: templates/webApps
                type: bicep
                scope: "Resource Group"
                resourceGroupName: "$(environmentName)$(nc-deptService)$(nc-function-infrastructure)$(nc-resource-resourcegroup)$(nc-region-id)01"
                preDeployScriptsList:
                  - displayName: Get WebApp image tag if it exists
                    scriptPath: "scripts/Get-ExistingWebAppVersion.ps1"
                    ScriptArguments: >
                      -WebAppNames '$(webAppNames)'
                      -ResourceGroupName '$(environmentName)$(nc-deptService)$(nc-function-infrastructure)$(nc-resource-resourcegroup)$(nc-region-id)01'
                      -IsSlotsEnabled $$(slotsEnabled)
                postDeployScriptsList:
                  - displayName: Set AppServices list if deployment slots are enabled
                    scriptPath: "scripts/Set-AppServiceSlotNames.ps1"
                    ScriptArguments: >
                      -IsSlotsEnabled $$(slotsEnabled)
                      -WebAppNames '$(webAppNames)'
                  - displayName: Resolve Private Endpoint IP for WebApps
                    scriptRepo: MMOPipelineCommon
                    scriptPath: "scripts/Get-ResourcePrivateEndPointsDnsRecordsAsJson.ps1"
                    ScriptArguments: >
                      -ResourceGroupName '$(environmentName)$(nc-deptService)$(nc-function-infrastructure)$(nc-resource-resourcegroup)$(nc-region-id)01'
                      -ResourceName '$(webApps)'
                      -IsSecondaryRegion $true
                  - displayName: Set DNS record for WebApps
                    scriptRepo: MMOPipelineCommon
                    scriptPath: "scripts/Set-PrivateDnsRecordSet.ps1"
                    ScriptArguments: >
                      -UpdateAllDnsZones $true

          - ${{ if or(eq(variables.IsAll, true), eq(variables.IsFunctionApps, true)) }}:
              - name: functionApps
                path: templates/functionApps
                type: bicep
                scope: "Resource Group"
                resourceGroupName: "$(environmentName)$(nc-deptService)$(nc-function-infrastructure)$(nc-resource-resourcegroup)$(nc-region-id)01"
                preDeployScriptsList:
                  - displayName: Get FunctionApp image tag if it exists
                    scriptPath: "scripts/Get-ExistingWebAppVersion.ps1"
                    ScriptArguments: >
                      -WebAppNames '$(functionAppName)'
                      -ResourceGroupName '$(environmentName)$(nc-deptService)$(nc-function-infrastructure)$(nc-resource-resourcegroup)$(nc-region-id)01'
                      -IsSlotsEnabled $$(slotsEnabled)
                postDeployScriptsList:
                  - displayName: Set AppServices list if deployment slots are enabled
                    scriptPath: "scripts/Set-AppServiceSlotNames.ps1"
                    ScriptArguments: >
                      -IsSlotsEnabled $$(slotsEnabled)
                      -WebAppNames '$(functionAppName)'
                  - displayName: Resolve Private Endpoint IP for '$(functionAppName)'
                    scriptRepo: MMOPipelineCommon
                    scriptPath: "scripts/Get-ResourcePrivateEndPointsDnsRecordsAsJson.ps1"
                    ScriptArguments: >
                      -ResourceGroupName '$(environmentName)$(nc-deptService)$(nc-function-infrastructure)$(nc-resource-resourcegroup)$(nc-region-id)01'
                      -ResourceName '$(webApps)'
                      -IsSecondaryRegion $true
                  - displayName: Set DNS record for '$(functionAppName)'
                    scriptRepo: MMOPipelineCommon
                    scriptPath: "scripts/Set-PrivateDnsRecordSet.ps1"
                    ScriptArguments: >
                      -UpdateAllDnsZones $true

          - ${{ if or(eq(variables.IsAll, true), eq(variables.IsKeyVaultRoleAssignments, true)) }}:
              - name: keyVaultRoleAssignments
                path: templates/keyVaults
                type: bicep
                scope: "Resource Group"
                resourceGroupName: "$(environmentName)$(nc-deptService)$(nc-function-infrastructure)$(nc-resource-resourcegroup)$(nc-static-res-region-id)02"

          - ${{ if or(eq(variables.IsAll, true), eq(variables.IsLogicApps, true)) }}:
              - name: logicAppsAsp
                isDeployToSecondaryRegions: false
                path: templates/logicAppsStandard
                type: bicep
                scope: "Resource Group"
                resourceGroupName: "$(environmentName)$(nc-deptService)$(nc-function-infrastructure)$(nc-resource-resourcegroup)$(nc-region-id)01"
              
              - name: logicApps
                isDeployToSecondaryRegions: false
                path: templates/logicAppsStandard
                type: bicep
                scope: "Resource Group"
                resourceGroupName: "$(environmentName)$(nc-deptService)$(nc-function-infrastructure)$(nc-resource-resourcegroup)$(nc-region-id)01"
                postDeployScriptsList:
                  - displayName: Set logicApps list
                    scriptPath: "scripts/Set-AppServiceSlotNames.ps1"
                    ScriptArguments: >
                      -IsSlotsEnabled $false
                      -WebAppNames '$(logicApps)'
                  - displayName: Resolve Private Endpoint IP for logicApps
                    scriptRepo: MMOPipelineCommon
                    scriptPath: "scripts/Get-ResourcePrivateEndPointsDnsRecordsAsJson.ps1"
                    ScriptArguments: >
                      -ResourceGroupName '$(environmentName)$(nc-deptService)$(nc-function-infrastructure)$(nc-resource-resourcegroup)$(nc-region-id)01'
                      -ResourceName '$(webApps)'
                      -IsSecondaryRegion $true
                  - displayName: Set DNS record for logicApps
                    scriptRepo: MMOPipelineCommon
                    scriptPath: "scripts/Set-PrivateDnsRecordSet.ps1"
                    ScriptArguments: >
                      -UpdateAllDnsZones $true
              
              - name: logicAppsStorageRoleAssignments
                path: templates/logicAppsStandard
                type: bicep
                scope: "Resource Group"
                resourceGroupName: "$(environmentName)$(nc-deptService)$(nc-function-infrastructure)$(nc-resource-resourcegroup)$(nc-static-res-region-id)02"
              
              - name: logicAppsServiceBusRoleAssignments
                path: templates/logicAppsStandard
                type: bicep
                scope: "Resource Group"
                resourceGroupName: "$(environmentName)$(nc-deptService)$(nc-function-infrastructure)$(nc-resource-resourcegroup)$(nc-region-id)01"

          - ${{ if or(eq(variables.IsAll, true), eq(variables.IsConnectionStrings, true)) }}:
              - name: connectionStrings
                path: templates/connectionStrings
                type: bicep
                scope: "Resource Group"
                resourceGroupName: "$(environmentName)$(nc-deptService)$(nc-function-infrastructure)$(nc-resource-resourcegroup)$(nc-static-res-region-id)02"

          - ${{ if or(eq(variables.IsAll, true), eq(variables.IsApiConnections, true)) }}:
              - name: apiConnections
                path: templates/apiConnections
                type: bicep
                scope: "Resource Group"
                resourceGroupName: "$(environmentName)$(nc-deptService)$(nc-function-infrastructure)$(nc-resource-resourcegroup)$(nc-region-id)01"
