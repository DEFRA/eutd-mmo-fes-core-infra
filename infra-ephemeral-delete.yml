name: $(BuildID)

trigger: none

pr: none

schedules:
  - cron: "30 19 * * 1-5"
    displayName: Daily Delete at 7:30 PM UTC
    branches:
      include:
        - main
    always: true

parameters:
  - name: deployToDevelopmentEnvironment   
    displayName: "Deploy from Feature Branch"
    type: boolean
    default: true

resources:
  repositories:
    - repository: MMOPipelineCommon
      name: "DEFRA/eutd-mmo-fes-pipeline-common"
      endpoint: DEFRA
      type: github
      ref: refs/heads/main

extends:
  template: /includes/infra-deploy.yaml@MMOPipelineCommon
  parameters:
    deployToDevelopmentEnvironment: ${{ parameters.deployToDevelopmentEnvironment }}
    deployToSecondaryRegion: false
    additionalRepositories: 
      - MMOPipelineCommon
    groupedDeployments:
      - name: Ephemeral_Delete_Workflows_And_Resources
        timeoutInMinutes: 60
        deployments:
          - name: "Export_LogicApps_Workflow"
            scriptRepo: MMOPipelineCommon
            type: script
            scriptType: AzurePowerShell
            path: "scripts/Export-app-files.ps1"
            condition: and(succeeded(), eq(variables['ephemeral'], true))
            scriptArguments: -AppsRG '$(resourceGroupName)' -StorageRG '$(storageAccountRGName)' -AppsName '$(logicApps)' -StorageAccountName '$(storageAccountName)' -EnvironmentVariablesOnly $false -ContainerName 'workflows'
          - name: "Export_Web_Apps_Files"
            scriptRepo: MMOPipelineCommon
            type: script
            scriptType: AzurePowerShell
            condition: and(succeeded(), eq(variables['ephemeral'], true))
            path: "scripts/Export-app-files.ps1"
            scriptArguments: -AppsRG '$(resourceGroupName)' -StorageRG '$(storageAccountRGName)' -AppsName '$(webAppNames)' -StorageAccountName '$(storageAccountName)' -EnvironmentVariablesOnly $true -ContainerName 'app-files'
          - name: "Export_Function_Apps_Files"
            scriptRepo: MMOPipelineCommon
            type: script
            scriptType: AzurePowerShell
            condition: and(succeeded(), eq(variables['ephemeral'], true))
            path: "scripts/Export-app-files.ps1"
            scriptArguments: -AppsRG '$(resourceGroupName)' -StorageRG '$(storageAccountRGName)' -AppsName '$(functionApps)' -StorageAccountName '$(storageAccountName)' -EnvironmentVariablesOnly $true -ContainerName 'app-files'    
          
          - name: "Remove_Ephemeral_Resources"
            scriptRepo: MMOPipelineCommon
            type: script
            scriptType: AzurePowerShell
            path: "scripts/Remove-EphemeralResources.ps1"
            condition: and(succeeded(), eq(variables['ephemeral'], true))
            scriptArguments: -ResourceGroupName '$(environmentName)$(nc-deptService)$(nc-function-infrastructure)$(nc-resource-resourcegroup)$(nc-region-id)01'
