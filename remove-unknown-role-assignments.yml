name: $(BuildID)_Remove_Unknown_Role_Assignments

trigger: none
pr: none

parameters:
  - name: environment
    displayName: "Target Environment"
    type: string
    default: snd1
    values:
      - snd1
      - dev1
      - tst1
      - ssv_snd
      - ssv_dev
      - ssv_tst

  - name: dryRun
    displayName: "Dry Run (list only, no deletions)"
    type: boolean
    default: true

  - name: resourceGroupName
    displayName: "Resource Group Name"
    type: string

  - name: resourceName
    displayName: "Resource Name"
    type: string

  - name: roleDefinitionNames
    displayName: "Role Definition Names — comma-separated (e.g. Key Vault Secrets User, AcrPull)"
    type: string

variables:
  - ${{ if eq(parameters.environment, 'snd1') }}:
    - name: serviceConnection
      value: AZR-MMO-SND1
  - ${{ if eq(parameters.environment, 'dev1') }}:
    - name: serviceConnection
      value: AZR-MMO-DEV1
  - ${{ if eq(parameters.environment, 'tst1') }}:
    - name: serviceConnection
      value: AZR-MMO-TST1
  - ${{ if eq(parameters.environment, 'ssv_snd') }}:
    - name: serviceConnection
      value: AZR-MMO-SSV5
    - name: appServiceConnection
      value: AZR-MMO-SND1
  - ${{ if eq(parameters.environment, 'ssv_dev') }}:
    - name: serviceConnection
      value: AZR-MMO-SSV5
    - name: appServiceConnection
      value: AZR-MMO-DEV1
  - ${{ if eq(parameters.environment, 'ssv_tst') }}:
    - name: serviceConnection
      value: AZR-MMO-SSV5
    - name: appServiceConnection
      value: AZR-MMO-TST1
stages:
  - stage: Remove_Unknown_Role_Assignments
    displayName: "Remove Unknown Role Assignments [${{ parameters.environment }}]"
    pool:
      name: DEFRA-COMMON-ubuntu2204-SSV3
    jobs:
      - job: RemoveUnknownRoleAssignments
        displayName: "Remove Unknown Role Assignments"
        steps:
          - task: AzureCLI@2
            displayName: "Find and Remove Orphaned Role Assignments"
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: pscore
              scriptLocation: inlineScript
              failOnStandardError: false
              inlineScript: |
                $dryRun = [System.Convert]::ToBoolean("${{ parameters.dryRun }}")
                $isSSV  = "${{ parameters.environment }}" -like 'ssv*'

                az account set --subscription "$(serviceConnection)"

                $resourceName      = "${{ parameters.resourceName }}".Trim()
                $resourceGroupName = "${{ parameters.resourceGroupName }}".Trim()

                Write-Host "Looking up resource '$resourceName' in '$resourceGroupName'..."
                $resourceId = ([string](az resource list `
                    --name $resourceName `
                    --resource-group $resourceGroupName `
                    --query "[0].id" --output tsv)).Trim()
                if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($resourceId)) {
                    Write-Error "Resource '$resourceName' not found in '$resourceGroupName'."
                    exit 1
                }
                Write-Host "Resource ID : $resourceId"

                Write-Host "Listing role assignments..."
                $assignmentsJson = az role assignment list `
                    --scope $resourceId `
                    --include-inherited `
                    --fill-principal-name false `
                    --output json
                if ($LASTEXITCODE -ne 0) { Write-Error "Failed to list role assignments."; exit 1 }
                $allAssignments = $assignmentsJson | ConvertFrom-Json

                $roleNames = "${{ parameters.roleDefinitionNames }}" -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ }

                Write-Host ""
                if ($isSSV) {
                    Write-Host "Switching to app subscription for managed identity lookup..."
                    az account set --subscription "$(appServiceConnection)"
                }
                Write-Host "Fetching live managed identity principal IDs from ARM..."
                $uamiIds = @(az identity list `
                    --query "[].principalId" --output tsv 2>$null | Where-Object { $_ })
                $samiIds = @(az resource list `
                    --query "[?identity.principalId!=null].identity.principalId" --output tsv 2>$null | Where-Object { $_ })
                $knownIds = [System.Collections.Generic.HashSet[string]]::new(
                    [string[]]($uamiIds + $samiIds),
                    [System.StringComparer]::OrdinalIgnoreCase
                )
                Write-Host "Live principal IDs found: $($knownIds.Count) (UAMI=$($uamiIds.Count), SAMI=$($samiIds.Count))"

                $orphaned = [System.Collections.Generic.List[object]]::new()
                $totalChecked = 0

                foreach ($roleName in $roleNames) {
                    Write-Host ""
                    Write-Host "=== $roleName ==="
                    $filtered = $allAssignments | Where-Object {
                        $_.scope -eq $resourceId -and $_.roleDefinitionName -eq $roleName
                    }
                    Write-Host "Found $($filtered.Count) assignment(s) directly on '$resourceName'."
                    foreach ($a in $filtered) {
                        $totalChecked++
                        if ($knownIds.Contains($a.principalId)) {
                            Write-Host "  [LIVE]     principalId=$($a.principalId)"
                        } else {
                            Write-Host "  [ORPHANED] principalId=$($a.principalId)"
                            $orphaned.Add($a)
                        }
                    }
                }

                Write-Host ""
                Write-Host "Summary: Checked=$totalChecked  Orphaned=$($orphaned.Count)"
                Write-Host ""

                if ($orphaned.Count -eq 0) { Write-Host "No orphaned assignments found. Nothing to remove."; exit 0 }

                Write-Host "Orphaned assignments:"
                foreach ($a in $orphaned) {
                    Write-Host "  Role=$($a.roleDefinitionName)  PrincipalId=$($a.principalId)  Id=$($a.id)"
                }
                Write-Host ""

                if ($dryRun) {
                    Write-Host "[DRY RUN] $($orphaned.Count) assignment(s) would be deleted. Set 'Dry Run' to false to execute."
                    exit 0
                }

                if ($isSSV) {
                    Write-Host "Switching back to SSV subscription for deletion..."
                    az account set --subscription "$(serviceConnection)"
                }
                Write-Host "Deleting $($orphaned.Count) orphaned assignment(s)..."
                $removed = 0; $failed = 0
                foreach ($a in $orphaned) {
                    Write-Host "  Removing $($a.roleDefinitionName) for principalId=$($a.principalId)..."
                    az role assignment delete --ids $a.id --output none
                    if ($LASTEXITCODE -ne 0) { Write-Warning "  [FAILED] $($a.id)"; $failed++ }
                    else                     { Write-Host "  [OK] Removed."; $removed++ }
                }
                Write-Host ""
                Write-Host "Done. Removed=$removed  Failed=$failed"
                if ($failed -gt 0) { exit 1 }

