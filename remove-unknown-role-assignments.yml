name: $(BuildID)_Remove_Unknown_Role_Assignments

trigger: none
pr: none

parameters:
  - name: environment
    displayName: "Target Environment"
    type: string
    default: snd1
    values:
      - snd1
      - dev1
      - tst1

  - name: dryRun
    displayName: "Dry Run (list only, no deletions)"
    type: boolean
    default: true

  - name: resourceGroupName
    displayName: "Resource Group Name"
    type: string

  - name: resourceName
    displayName: "Resource Name"
    type: string

  - name: roleDefinitionName
    displayName: "Role Definition Name (e.g. Key Vault Secrets User, AcrPull)"
    type: string

variables:
  - ${{ if eq(parameters.environment, 'snd1') }}:
    - name: serviceConnection
      value: AZR-MMO-SND1
  - ${{ if eq(parameters.environment, 'dev1') }}:
    - name: serviceConnection
      value: AZR-MMO-DEV1
  - ${{ if eq(parameters.environment, 'tst1') }}:
    - name: serviceConnection
      value: AZR-MMO-TST1

stages:
  - stage: Remove_Unknown_Role_Assignments
    displayName: "Remove Unknown Role Assignments [${{ parameters.environment }}]"
    pool:
      name: DEFRA-COMMON-ubuntu2204-SSV3
    jobs:
      - job: RemoveUnknownRoleAssignments
        displayName: "Remove Unknown Role Assignments"
        steps:
          - task: AzureCLI@2
            displayName: "Find and Remove Unknown (Orphaned) Role Assignments"
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: pscore
              scriptLocation: inlineScript
              failOnStandardError: true
              inlineScript: |
                $dryRun = [System.Convert]::ToBoolean("${{ parameters.dryRun }}")

                az account set --subscription "$(serviceConnection)"

                $resourceId = (az resource list --name "${{ parameters.resourceName }}" --resource-group "${{ parameters.resourceGroupName }}" --query "[0].id" --output tsv).Trim()
                if ([string]::IsNullOrWhiteSpace($resourceId)) {
                    Write-Error "Resource '${{ parameters.resourceName }}' not found in resource group '${{ parameters.resourceGroupName }}'."
                    exit 1
                }
                Write-Host "Resource ID: $resourceId"

                $allAssignments = az role assignment list --scope $resourceId --include-inherited --output json | ConvertFrom-Json

                $filtered = $allAssignments | Where-Object {
                    $_.scope -eq $resourceId -and $_.roleDefinitionName -eq "${{ parameters.roleDefinitionName }}"
                }
                Write-Host "Found $($filtered.Count) '${{ parameters.roleDefinitionName }}' assignment(s) directly on resource."

                $orphaned = $filtered | Where-Object {
                    az ad sp show --id $_.principalId --output none 2>$null
                    $LASTEXITCODE -ne 0
                }
                Write-Host "Orphaned (principal deleted from Azure AD): $($orphaned.Count)"
                $orphaned | ForEach-Object { Write-Host "  - $($_.principalId) | $($_.roleDefinitionName) | $($_.id)" }

                if ($orphaned.Count -eq 0) { Write-Host "Nothing to remove."; exit 0 }

                if ($dryRun) {
                    Write-Host "[DRY RUN] $($orphaned.Count) assignment(s) would be deleted. Set Dry Run to false to proceed."
                    exit 0
                }

                $orphaned | ForEach-Object {
                    Write-Host "Removing: $($_.roleDefinitionName) | PrincipalId: $($_.principalId)"
                    az role assignment delete --ids $_.id --output none
                    if ($LASTEXITCODE -ne 0) { throw "Failed to delete assignment: $($_.id)" }
                    Write-Host "  [OK] Removed."
                }
                Write-Host "Done. Removed $($orphaned.Count) assignment(s)."

