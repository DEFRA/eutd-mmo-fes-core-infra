name: $(BuildID)_Remove_Unknown_Role_Assignments

trigger: none
pr: none

parameters:
  - name: environment
    displayName: "Target Environment"
    type: string
    default: snd1
    values:
      - snd1
      - dev1
      - tst1

  - name: dryRun
    displayName: "Dry Run (list only, no deletions)"
    type: boolean
    default: true

  - name: resourceGroupName
    displayName: "Resource Group Name"
    type: string

  - name: resourceName
    displayName: "Resource Name (the specific Azure resource to clean up)"
    type: string

  - name: roleDefinitionName
    displayName: "Role Definition Name (e.g. Key Vault Secrets User, AcrPull, Storage Blob Data Contributor)"
    type: string

variables:
  - ${{ if eq(parameters.environment, 'snd1') }}:
    - name: serviceConnection
      value: AZR-MMO-SND1
  - ${{ if eq(parameters.environment, 'dev1') }}:
    - name: serviceConnection
      value: AZR-MMO-DEV1
  - ${{ if eq(parameters.environment, 'tst1') }}:
    - name: serviceConnection
      value: AZR-MMO-TST1

stages:
  - stage: Remove_Unknown_Role_Assignments
    displayName: "Remove Unknown Role Assignments [${{ parameters.environment }}]"
    pool:
      name: DEFRA-COMMON-ubuntu2204-SSV3
    jobs:
      - job: RemoveUnknownRoleAssignments
        displayName: "Remove Unknown Role Assignments"
        steps:
          # ── Azure CLI step ────────────────────────────────────────────────────────────
          # az role assignment list returns raw RBAC data from Azure without resolving
          # principals via Graph.  Orphaned (deleted) principals have an empty principalName;
          # valid ones (users, SPs, managed identities, groups) always have a non-empty
          # principalName — regardless of the service principal's Graph permissions.
          - task: AzureCLI@2
            displayName: "Find and Remove Unknown (Orphaned) Role Assignments via Azure CLI"
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: pscore
              scriptLocation: inlineScript
              failOnStandardError: true
              addSpnToEnvironment: false
              inlineScript: |
                $dryRun             = [System.Convert]::ToBoolean("${{ parameters.dryRun }}")
                $rgName             = "${{ parameters.resourceGroupName }}"
                $resourceName       = "${{ parameters.resourceName }}"
                $roleDefinitionName = "${{ parameters.roleDefinitionName }}"

                # ── Select subscription ───────────────────────────────────────────────────
                Write-Host "Setting active subscription: $(serviceConnection)"
                az account set --subscription "$(serviceConnection)"
                Write-Host ""

                # ── Resolve exact resource scope ──────────────────────────────────────────
                Write-Host "Looking up resource '$resourceName' in resource group '$rgName'..."
                $resourceId = az resource list `
                    --name           $resourceName `
                    --resource-group $rgName `
                    --query          "[0].id" `
                    --output         tsv

                if ([string]::IsNullOrWhiteSpace($resourceId)) {
                    Write-Error "Resource '$resourceName' not found in resource group '$rgName'."
                    exit 1
                }

                $resourceId = $resourceId.Trim()
                Write-Host "Resource scope : $resourceId"

                # ── Retrieve all role assignments visible at this scope ────────────────────
                # --include-inherited ensures we capture everything (including inherited
                # assignments from parent scopes), so the scope filter below can strip them
                # out precisely rather than relying on CLI default behaviour.
                Write-Host ""
                Write-Host "Retrieving role assignments..."
                $allAssignments = az role assignment list `
                    --scope            $resourceId `
                    --include-inherited `
                    --output           json | ConvertFrom-Json

                Write-Host "Total role assignments found (including inherited): $($allAssignments.Count)"

                # ── FILTER 1: scope -eq $resourceId ──────────────────────────────────────
                # Each role assignment carries the scope at which it was CREATED.
                # Assignments propagated from subscription or resource-group level have a
                # parent path as their scope — not this resource's ResourceId.
                # Matching exactly removes all inherited assignments from consideration.
                #
                # ── FILTER 2: roleDefinitionName -eq $roleDefinitionName ─────────────────
                # Target only the specified role, leaving other roles (including other
                # Unknown ones) completely untouched.
                #
                # ── FILTER 3: empty principalName ─────────────────────────────────────────
                # Unlike Az PowerShell, the CLI returns raw RBAC data without Graph lookups.
                # When a security principal (user / SP / managed identity / group) is deleted
                # from Azure AD, Azure RBAC has no name to return — principalName is empty.
                # Valid, live principals always have a non-empty principalName.
                $orphaned = $allAssignments | Where-Object {
                    $_.scope              -eq $resourceId         -and
                    $_.roleDefinitionName -eq $roleDefinitionName -and
                    [string]::IsNullOrEmpty($_.principalName)
                }

                Write-Host ""
                Write-Host "Orphaned '$roleDefinitionName' assignments directly on resource: $($orphaned.Count)"
                Write-Host ""

                if ($orphaned.Count -eq 0) {
                    Write-Host "Nothing to remove — exiting cleanly."
                    exit 0
                }

                # ── List every matching assignment ────────────────────────────────────────
                Write-Host "--- Orphaned Role Assignments ---"
                $orphaned | ForEach-Object {
                    Write-Host "  Id                : $($_.id)"
                    Write-Host "  RoleDefinitionName: $($_.roleDefinitionName)"
                    Write-Host "  PrincipalId       : $($_.principalId)"
                    Write-Host "  PrincipalName     : '$($_.principalName)'"
                    Write-Host "  Scope             : $($_.scope)"
                    Write-Host "  ---------------------------------"
                }

                # ── Act ──────────────────────────────────────────────────────────────────
                if ($dryRun) {
                    Write-Host ""
                    Write-Host "[DRY RUN] $($orphaned.Count) assignment(s) listed above would be deleted."
                    Write-Host "[DRY RUN] Set 'Dry Run' to false and re-run to perform actual deletion."
                } else {
                    Write-Host ""
                    Write-Host "Deleting $($orphaned.Count) orphaned role assignment(s)..."
                    $removed = 0
                    $failed  = 0

                    foreach ($assignment in $orphaned) {
                        try {
                            Write-Host "Removing: $($assignment.roleDefinitionName) | PrincipalId: $($assignment.principalId) | Scope: $($assignment.scope)"

                            # --ids accepts the full ARM resource ID of the role assignment.
                            # This is the most precise delete method — no ambiguity, no
                            # accidental matches against other assignments.
                            az role assignment delete --ids $assignment.id --output none

                            if ($LASTEXITCODE -ne 0) {
                                throw "az role assignment delete exited with code $LASTEXITCODE"
                            }

                            $removed++
                            Write-Host "  [OK] Removed."
                        } catch {
                            $failed++
                            Write-Warning "  [FAILED] $($_.Exception.Message)"
                        }
                    }

                    Write-Host ""
                    Write-Host "=== Summary ==="
                    Write-Host "  Removed : $removed"
                    Write-Host "  Failed  : $failed"
                    Write-Host "  Total   : $($orphaned.Count)"

                    if ($failed -gt 0) {
                        Write-Error "$failed role assignment(s) could not be removed. Review warnings above."
                        exit 1
                    }
                }
